# This workflow publishes tagged releases from the public production repository.
name: Publish Gem
on:
  # Manual retries must target an existing release tag, for example:
  # gh workflow run publish-gem.yml --ref v0.7.0
  workflow_dispatch:

  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: github.repository == 'privy-io/ruby-sdk' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: package-release

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          bundler-cache: false
      - run: |-
          bundle install

      - name: Configure RubyGems Credentials
        uses: rubygems/configure-rubygems-credentials@762a4b77c3300434bb57c7ce80b20e36231927aa # v2.0.0

      - name: Publish to RubyGems.org
        run: |
          bash ./bin/publish-gem
